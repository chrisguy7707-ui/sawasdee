[package]
name = "sawasdee"
version = "0.4.0"
edition = "2021"

[lib]
name = "sawasdee"
crate-type = ["cdylib", "rlib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "sawasdee"
path = "src/main.rs"

[features]
# Google Play build: units after the free ones need a purchase (tools/build_android.sh play)
play = []

[dependencies]
log = "0.4"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }

# iPhone: the screen is drawn through Apple's Metal (wgpu); glow/OpenGL is not available there.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "android-native-activity"] }
android_logger = "0.14"
jni = "0.21"
winit = { version = "0.30", features = ["android-native-activity"] }

# ---- Android app (built with `cargo apk build --release`, see tools/build_android.sh)
[package.metadata.android]
package = "com.sawasdee.thai"
apk_name = "Sawasdee"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[package.metadata.android.application]
label = "사왓디-태국어 학습앱"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"

# Signing: the key file and its password are NOT stored here. tools/build_android.sh passes them
# to cargo-apk through CARGO_APK_RELEASE_KEYSTORE and CARGO_APK_RELEASE_KEYSTORE_PASSWORD.
