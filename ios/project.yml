# Xcode project description. Make the project with:  cd ios && xcodegen generate
name: Sawasdee
options:
  bundleIdPrefix: com.sawasdee
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.sawasdee.thai
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
targets:
  Sawasdee:
    type: application
    platform: iOS
    sources:
      - path: Sawasdee
    info:
      path: Sawasdee/Info.plist
      properties:
        CFBundleDisplayName: 사왓디
        CFBundleName: Sawasdee
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: SawasdeeSceneDelegate
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 내 발음을 녹음해서 원어민 소리와 비교해 들을 때만 마이크를 사용해요. 녹음은 기기 안에만 잠깐 저장되고 어디로도 전송되지 않아요.
    preBuildScripts:
      - name: Build Rust library
        script: sh "$SRCROOT/build_rust.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: Foundation.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        # Link the Rust static library by its full path (a leftover .dylib must never win).
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ["$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release/libsawasdee.a", -lc++, -lresolv]
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["$(PROJECT_DIR)/../target/aarch64-apple-ios/release/libsawasdee.a", -lc++, -lresolv]
